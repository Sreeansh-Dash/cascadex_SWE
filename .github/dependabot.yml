version: 2
updates:
  # ─────────────────────────────────────────────────────────────────────────
  # Python backend — pip ecosystem
  # ─────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  # ─────────────────────────────────────────────────────────────────────────
  # Flutter frontend — pub ecosystem
  # ─────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pub"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"

  # ─────────────────────────────────────────────────────────────────────────
  # GitHub Actions — actions ecosystem
  # ─────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
