name: CascadeX CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Backend — lint + pytest (with Neo4j service container)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/test_password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test_password 'SHOW DATABASES;' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run pytest (all tests — Neo4j available via service container)
        run: pytest --tb=short -q
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test_password
          JWT_SECRET: test_jwt_secret_for_ci
          ENV: dev

  # ---------------------------------------------------------------------------
  # Job 2: Frontend — analyze + test
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (flutter analyze + test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (flutter analyze)
        run: flutter analyze

      - name: Run widget tests
        run: flutter test
