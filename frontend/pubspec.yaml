name: cascadex
description: CascadeX — Drug-to-Drug Interaction Warning System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Secure token storage (never SharedPreferences)
  flutter_secure_storage: ^9.2.2

  # Local cache (offline-first medication list)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP client
  dio: ^5.6.0

  # Navigation
  go_router: ^14.2.7

  # PDF export (Phase 08)
  pdf: ^3.11.1
  printing: ^5.13.1

  # Icons
  cupertino_icons: ^1.0.8

  # Phase 05: OCR — on-device ML Kit text recognition (no cloud calls)
  google_mlkit_text_recognition: ^0.13.0

  # Phase 05: Camera capture
  image_picker: ^1.1.2

  # Phase 05: HTTP calls from OCR service
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.16.0

  # Linting
  flutter_lints: ^4.0.0

  # Phase 05: HTTP mock for widget tests (http package includes MockClient)
  mockito: ^5.4.4

flutter:
  uses-material-design: true
